name: CKShetty GitOps Pipeline

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets:DOCKERHUB_USERNAME }}
          password: ${{ secrets:DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./app
          push: true
          tags: |
            ckshetty4/poc20-app:${{ github.sha }}
            ckshetty4/poc20-app:latest

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Kustomize Image Tags
        run: |
          # Use absolute workspace paths so both environments update reliably
          cd $GITHUB_WORKSPACE/kustomize/overlays/dev
          kustomize edit set image ckshetty4/poc20-app=ckshetty4/poc20-app:${{ github.sha }}

          cd $GITHUB_WORKSPACE/kustomize/overlays/prod
          kustomize edit set image ckshetty4/poc20-app=ckshetty4/poc20-app:${{ github.sha }}

      - name: Commit and Push Changes
        run: |
          git config --local user.email "ckshetty-bot@github.com"
          git config --local user.name "CKShetty-CI"
          git add .
          git commit -m "chore: sync tag ${{ github.sha }} [skip ci]" || echo "No changes"
          git push https://x-access-token:${{ secrets:GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}

      - name: Automated SSH Rollout to Free K3s Host
        uses: appleboy/ssh-action@master
        with:
          host: 13.201.62.71
          username: ubuntu
          key: ${{ secrets:EC2_SSH_KEY }}
          script: |
            # Pull down the newly updated manifest files to the EC2 host machine
            cd ~/poc20-repo
            git pull origin main
            
            # Re-apply the updated overlays to ensure networking fields align
            sudo kubectl apply -k kustomize/overlays/dev/
            sudo kubectl apply -k kustomize/overlays/prod/
            
            # Force cluster eviction of cached image layers to load fresh code changes
            sudo kubectl rollout restart deployment/dev-ckshetty-app -n dev
            sudo kubectl rollout restart deployment/prod-ckshetty-app -n prod
