apiVersion: apps/v1
kind: Deployment
metadata:
  name: ckshetty-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ckshetty-app
  template:
    metadata:
      labels:
        app: ckshetty-app
    spec:
      containers:
      - name: web
        image: ckshetty/poc20-app:latest
        ports:
        - containerPort: 8080
